name: Build and Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g., 1.0.0-r5). Leave empty for auto-increment.'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: llm-terminal
  BASE_VERSION: "1.0.3"

permissions:
  contents: read
  packages: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            NEW_VERSION="${{ github.event.inputs.version }}"
            echo "Using manual override: $NEW_VERSION"
          else
            TAGS=$(skopeo list-tags docker://ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }} 2>/dev/null | jq -r '.Tags[]?' || echo "")
            echo "Found tags: [$TAGS]"

            HIGHEST_REV=0
            for tag in $TAGS; do
              if [[ $tag =~ ^${BASE_VERSION}-r([0-9]+)$ ]]; then
                REV=${BASH_REMATCH[1]}
                if [[ $REV -gt $HIGHEST_REV ]]; then
                  HIGHEST_REV=$REV
                fi
              fi
            done

            NEXT_REV=$((HIGHEST_REV + 1))
            NEW_VERSION="${BASE_VERSION}-r${NEXT_REV}"
          fi

          echo "========================================"
          echo "RESULT: version=${NEW_VERSION}"
          echo "========================================"
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT

  build-and-push:
    runs-on: ubuntu-latest
    needs: determine-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.determine-version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "**Image:** \`${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ needs.determine-version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`${{ needs.determine-version.outputs.version }}\`, \`latest\`" >> $GITHUB_STEP_SUMMARY
